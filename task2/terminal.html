<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Compiler terminal evidence</title>
<style>body{margin:0;background:#0e1823;color:#e1eee4;font:16px/1.5 Consolas,monospace}header{padding:14px 24px;background:#223447;display:flex;align-items:center;gap:14px;font:15px system-ui}select,button{font:inherit;padding:7px;border-radius:4px;border:0}pre{padding:20px 26px;margin:0;white-space:pre-wrap}a{color:#d8eaff;margin-left:auto}</style></head>
<body><header>Compiler CLI terminal<select id="examples" aria-label="Terminal example"></select><button id="run">Run command</button><a href="/">Compiler interface</a></header><pre id="terminal" aria-live="polite">Select an input and run the command.</pre>
<script>const el=id=>document.getElementById(id);fetch('/api/examples').then(r=>r.json()).then(data=>{for(const key of Object.keys(data)){const o=document.createElement('option');o.value=key;o.textContent=key;el('examples').append(o)}});el('run').onclick=async()=>{el('run').disabled=true;el('terminal').textContent='Executing compiler CLI...';try{const r=await fetch('/api/terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({example:el('examples').value})});const data=await r.json();el('terminal').textContent=data.transcript||data.error}finally{el('run').disabled=false}};</script></body></html>
